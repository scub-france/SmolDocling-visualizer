# =============================================================================
# Docling Studio — Development stack
#
# Usage:
#   COMPOSE_PROFILES=default docker compose -f docker-compose.dev.yml up
#   COMPOSE_PROFILES=ingestion docker compose -f docker-compose.dev.yml up
#
# The default stack contains only the frontend and SQLite-backed parser.
# Optional `ingestion` and `graph` profiles add their respective services.
# Frontend runs Vite dev server with HMR, backend runs with --reload.
# =============================================================================

services:
  # --- Neo4j (graph-native document structure) ---
  neo4j:
    profiles: ["graph", "ingestion"]
    image: neo4j:5.15-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD:-changeme} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- OpenSearch (single-node, security disabled for local dev) ---
  opensearch:
    profiles: ["ingestion"]
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- OpenSearch Dashboards (index inspection UI) ---
  opensearch-dashboards:
    profiles: ["ingestion"]
    image: opensearchproject/opensearch-dashboards:2
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  # --- Embedding service (sentence-transformers) ---
  embedding:
    profiles: ["ingestion"]
    build:
      context: ./embedding-service
      args:
        # See docker-compose.yml — same opt-in pattern, HF-off by default.
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
        BAKE_MODEL: ${BAKE_MODEL:-false}
    ports:
      - "8001:8001"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  # --- Docling Serve (remote conversion engine) ---
  # Same opt-in pattern as docker-compose.yml — see that file for the full
  # rationale. Activate with `docker compose -f docker-compose.dev.yml \
  # --profile remote up` plus `CONVERSION_MODE=remote`.
  docling-serve:
    profiles: ["remote"]
    image: quay.io/docling-project/docling-serve-cpu:v1.21.0
    ports:
      - "5001:5001"
    # Same race-safe healthcheck as docker-compose.yml — actually invoke
    # `/v1/convert/file` and match HTTP code (422 = form validation = ready,
    # 404 = handler not yet wired up).
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X POST --max-time 5 -o /dev/null -w 'status=%{http_code}' http://localhost:5001/v1/convert/file | grep -qE 'status=(200|400|405|422)'"
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4g

  # --- Backend (FastAPI with hot-reload) ---
  document-parser:
    build:
      context: ./document-parser
      target: ${CONVERSION_MODE:-local}
      args:
        # See docker-compose.yml for the full rationale on these build-args.
        BAKE_MODELS: ${BAKE_MODELS:-false}
        WITH_REASONING: ${WITH_REASONING:-false}
    expose:
      - "8000"
    volumes:
      - ./document-parser:/app
      - ./document-parser/uploads:/app/uploads
      - ./document-parser/data:/app/data
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Defaults match docker-compose.yml — see that file's rationale.
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-http://docling-serve:5001}
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY:-}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-100}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      BATCH_PAGE_SIZE: ${BATCH_PAGE_SIZE:-0}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-}
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      # Fernet sealing-at-rest for store credentials (#279). See .env.example
      # for the one-liner to generate a key. No default on purpose: a dev
      # who creates a sealed store must persist the key in their own .env.
      STORE_SECRET_KEY: ${STORE_SECRET_KEY:-}
    profiles: ["default", "graph", "ingestion", "remote"]
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    deploy:
      resources:
        limits:
          memory: 4g

  # --- Frontend (Vite dev server with HMR) ---
  frontend:
    profiles: ["default", "graph", "ingestion", "remote"]
    image: node:20-alpine
    working_dir: /app
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_APP_VERSION: dev
      VITE_API_PROXY_TARGET: http://document-parser:8000
      # Polling keeps Vite HMR reliable across Docker Desktop bind mounts.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    depends_on:
      - document-parser

volumes:
  opensearch_data:
  neo4j_data:
  neo4j_logs:
  uploads_data:
  db_data:
  frontend_node_modules:
