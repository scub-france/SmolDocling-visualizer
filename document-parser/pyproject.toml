[project]
name = "document-parser"
version = "0.0.0"
description = "Docling Studio FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  # 2.65.2: `DoclingDocument.concatenate` (2.45) shifts the page numbers of
  # every item, which the batch merge relies on (#344).
  "docling-core[chunking]>=2.65.2,<3.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "pdf2image>=1.17.0,<2.0.0",
  "pillow>=10.0.0,<11.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pypdfium2>=4.0.0,<5.0.0",
  "opensearch-py[async]>=2.6.0,<3.0.0",
  "neo4j>=5.15.0,<6.0.0",
  "cryptography>=43.0.0,<46.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "pytestarch>=2.0.0,<3.0.0",
  "ruff>=0.11.0,<1.0.0",
]
local = [
  "docling>=2.80.0,<3.0.0",
  # `torch` + `torchvision` are pulled transitively by docling; we declare
  # them explicitly so we can redirect them to the PyTorch CPU index via
  # [tool.uv.sources] below. Without this, `uv sync --group local` would
  # resolve to the default (CUDA) build from PyPI — ~3 GB of useless
  # CUDA + triton in the latest-local image. See docs/design/254-docker-slim-post-uv.md.
  "torch",
  "torchvision",
]
# Opt-in reasoning stack (R&D). Pulled in only when the image is built
# with --build-arg WITH_REASONING=true (see document-parser/Dockerfile +
# docs/design/254-docker-slim-post-uv.md). When these are absent — or too old
# to carry the surface the adapter binds to — infra/docling_agent_reasoning
# .deps_present() returns False, the runner is left unwired and /api/reasoning
# surfaces 503.
reasoning = [
  # 0.6.0 is the first release carrying the public `run_with_trace()` surface
  # (docling-project/docling-agent#39) and the `backends` package the adapter
  # imports. 0.1.0 had neither: it resolved, `deps_present()` passed, and every
  # Ask 500'd on `ModuleNotFoundError: docling_agent.backends`.
  "docling-agent==0.6.0",
  "mellea==0.4.2",
]

[tool.uv]
package = false

# PyTorch CPU wheels — declared as an explicit index so it is consulted
# only for packages that explicitly source from it (cf. [tool.uv.sources]
# below). Avoids polluting the resolution of every other dep.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking
  "RUF",  # ruff-specific
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
  "N815",   # camelCase in Pydantic models (intentional — matches frontend API contract)
  "TC003",  # datetime import used at runtime by Pydantic
]

[tool.ruff.lint.isort]
known-first-party = ["api", "domain", "persistence", "services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates annotations at runtime — moving these imports into a
# TYPE_CHECKING block would break model construction. Declaring the model base
# classes here keeps TC001/TC002 from suggesting it, instead of scattering
# per-import `# noqa: TC001` across the API layer.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "api.schemas._CamelModel",
]
