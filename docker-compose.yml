# =============================================================================
# Docling Studio — local development / quick-start compose.
#
# DEV DEFAULTS — NOT PRODUCTION-READY.
# This file ships sensible defaults for `docker compose up` to "just work" on
# a developer laptop. It is NOT a production deployment template:
#   - Neo4j boots with `NEO4J_PASSWORD=changeme` if the env var is unset.
#   - OpenSearch runs single-node with `DISABLE_SECURITY_PLUGIN=true`
#     (no TLS, no auth). Fine for local indexing experiments, never for
#     anything reachable from outside `localhost`.
#   - No HTTPS termination, no reverse-proxy hardening, no rate limit on
#     the embedding/OpenSearch services, ports bound to all interfaces.
#
# Operators running their own Docling Studio instance MUST:
#   1. Override `NEO4J_PASSWORD` (and rotate it) — see `.env.example`.
#   2. Re-enable the OpenSearch security plugin and configure TLS/users —
#      see https://opensearch.org/docs/latest/security/.
#   3. Bind sensitive services to internal networks only, terminate TLS at
#      a reverse proxy, and align CORS_ORIGINS / RATE_LIMIT_RPM with the
#      deployment surface.
#
# The audit pipeline expects this file to flag the dev defaults as such —
# don't silently strengthen them here without also updating the dev DX.
# =============================================================================

services:
  # --- Neo4j (graph-native document structure) ---
  # Dev-only auth: NEO4J_PASSWORD defaults to "changeme". Override in
  # `.env` (or any orchestrator secret store) before exposing this stack.
  neo4j:
    profiles: ["ingestion"]
    image: neo4j:5.15-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD:-changeme} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- OpenSearch (single-node, security DISABLED — DEV ONLY) ---
  # `DISABLE_SECURITY_PLUGIN: "true"` removes auth, TLS, and audit logging.
  # This is fine for a local dev cluster bound to 127.0.0.1; it is NOT safe
  # for anything reachable from another host. For production, drop this
  # var, switch to a hardened image, and configure users + TLS:
  # https://opensearch.org/docs/latest/security/configuration/
  opensearch:
    profiles: ["ingestion"]
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Embedding service (sentence-transformers) ---
  embedding:
    profiles: ["ingestion"]
    build:
      context: ./embedding-service
      args:
        # Pre-fetch the sentence-transformers model at build time. Same
        # rationale + opt-in pattern as document-parser's BAKE_MODELS:
        # default false so no compose build touches HuggingFace Hub by
        # accident. The first /embed call downloads the model into the
        # container's ~/.cache/huggingface. Mount that path as a volume
        # if you want to survive rebuilds without re-downloading.
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
        BAKE_MODEL: ${BAKE_MODEL:-false}
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2g

  # --- Docling Serve (remote conversion engine) ---
  # Opt-in via the `remote` profile. Run `docker compose --profile remote up`
  # (or `COMPOSE_PROFILES=remote docker compose up`) to start it, and pair
  # with `CONVERSION_MODE=remote` so the backend image is built lightweight
  # and `CONVERSION_ENGINE=remote` is baked in.
  #
  # Why this exists: in `local` mode the backend image bundles Docling and
  # ~1.3 GB of model checkpoints, which means every build / cold start
  # depends on HuggingFace Hub. On shared-IP CI runners that path hits
  # anonymous 429 rate limits (see commit 76b67ec / audit 0.6.2). The
  # official docling-serve image ships with models baked at the source —
  # talking to it over HTTP keeps the backend image small, removes HF
  # from our build/runtime, and tests the same code path operators use
  # when they front Docling with their own Serve cluster.
  docling-serve:
    profiles: ["remote"]
    image: quay.io/docling-project/docling-serve-cpu:v1.21.0
    expose:
      - "5001"
    # docling-serve registers `/v1/convert/*` decorators at import time
    # (so they show up in `/openapi.json` immediately) but the handler
    # actually returns 404 until the lifespan startup wires up the
    # converter pipeline. Neither `/version` nor `/openapi.json` catches
    # that — only invoking the endpoint does.
    #
    # The probe POSTs an empty body to `/v1/convert/file` and matches
    # the HTTP code: 422 = form validation rejected the missing file
    # (handler is live), 400/405 = also "alive". 404 = handler not
    # ready yet, 000 = connection refused or timeout — both fail.
    # No `$$` escaping needed because we use --write-out instead of
    # shell substitution.
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -X POST --max-time 5 -o /dev/null -w 'status=%{http_code}' http://localhost:5001/v1/convert/file | grep -qE 'status=(200|400|405|422)'"
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4g

  # --- Backend (FastAPI) ---
  document-parser:
    build:
      context: ./document-parser
      target: ${CONVERSION_MODE:-local}
      args:
        # Pre-fetch Docling model checkpoints at build time (+~1.3 GB).
        # Only meaningful when CONVERSION_MODE=local. Default false so
        # no `docker compose build` ever depends on HuggingFace Hub by
        # accident. To get the "instant first /api/convert" experience
        # locally, either: (a) start the docling-serve container with
        # `--profile remote`, or (b) opt in with `BAKE_MODELS=true
        # docker compose build` and accept the HF Hub download at build
        # time. End-user GHCR image `latest-local` is published with
        # bake=true by release.yml — the single sanctioned HF touch
        # point. See docs/architecture/huggingface-dependency-map.md.
        BAKE_MODELS: ${BAKE_MODELS:-false}
        WITH_REASONING: ${WITH_REASONING:-false}
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/data
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Defaults point at the `docling-serve` service so that
      # `docker compose --profile remote up` works without extra env. In
      # local mode the backend ignores this value (CONVERSION_ENGINE=local
      # bypasses ServeConverter entirely).
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-http://docling-serve:5001}
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY:-}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-100}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      BATCH_PAGE_SIZE: ${BATCH_PAGE_SIZE:-0}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-}
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      # Fernet sealing-at-rest for store credentials (#279). No default —
      # boot fails if sealed rows exist without this set. Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # MUST stay stable across restarts.
      STORE_SECRET_KEY: ${STORE_SECRET_KEY:-}
      # Surface flags (#257). Default-off in production; the e2e UI suite
      # opts in via STUDIO_MODE_ENABLED=true to exercise the legacy /studio
      # tests until they're rewritten against /docs/:id (0.7.0).
      STUDIO_MODE_ENABLED: ${STUDIO_MODE_ENABLED:-false}
      RAG_PIPELINE_ENABLED: ${RAG_PIPELINE_ENABLED:-true}
    deploy:
      resources:
        limits:
          memory: 4g

  # --- Frontend (nginx) ---
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    environment:
      NGINX_MAX_BODY_SIZE: ${NGINX_MAX_BODY_SIZE:-200M}
    depends_on:
      - document-parser

volumes:
  opensearch_data:
  neo4j_data:
  neo4j_logs:
  uploads_data:
  db_data:
