site_name: Docling Studio
site_description: Look inside what Docling extracts from your PDFs
site_url: https://scub-france.github.io/Docling-Studio/
repo_url: https://github.com/scub-france/Docling-Studio
repo_name: scub-france/Docling-Studio

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Get started: getting-started.md
  - User guide: user-guide.md
  - Configuration: configuration.md
  - Troubleshooting: troubleshooting.md
  - Contribute:
      - Contributing: https://github.com/scub-france/Docling-Studio/blob/main/CONTRIBUTING.md
      - Architecture: architecture.md
      - Bounding boxes: bbox-pipeline.md
  - Maintain: maintainers.md

extra_css:
  - stylesheets/extra.css

# Kept in the repo for maintainers and tooling, not published on the site.
exclude_docs: |
  audit/reports/
  design/
  demo/
  claude-code-commands.md
  git-workflow/autonomy-mode.md

validation:
  nav:
    # Process pages are reached from maintainers.md, not from the nav.
    omitted_files: info
    absolute_links: info
  links:
    absolute_links: info
    not_found: warn
    unrecognized_links: info

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
